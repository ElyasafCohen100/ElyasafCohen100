
name: Generate Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch GitHub Data
        run: node fetch-github.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate Dashboard SVG
        run: node generate-dashboard.js

      - name: Commit and push dashboard updates
        run: |
          git config user.name "ElyasafBot 🤖"
          git config user.email "92228398+ElyasafCohen100@users.noreply.github.com"
          git add dashboard.svg stats.json
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit"
          else
            git commit -m "🤖 Refresh GitHub dashboard"
            git push
          fi
